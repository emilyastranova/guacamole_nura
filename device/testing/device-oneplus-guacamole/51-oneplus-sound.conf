# WirePlumber ALSA override for OnePlus 7 Pro (guacamole)
# The TFA9874 amplifiers on QUATERNARY_MI2S_RX require 16-bit 48kHz audio.
# When PipeWire defaults to S24_32LE, the sample bits are not aligned
# to the 32-bit TDM slot MSB, resulting in extreme digital attenuation (-48dB).
# Enforcing S16LE restores full acoustic output volume across all audio streams.

monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_output.*"
      }
    ]
    actions = {
      update-props = {
        audio.format = "S16LE"
        audio.rate = 48000
      }
    }
  }
]
