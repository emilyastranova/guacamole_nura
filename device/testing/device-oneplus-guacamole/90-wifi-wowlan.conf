# Enable WoWLAN by default on all Wi-Fi devices so the STA stays associated
# across system suspend (wake on WoL magic packet or AP-side disconnect/deauth).
# Setting wake-on-wlan also enables the netdev's power/wakeup via the kernel
# set_wakeup path (nl80211 -> ieee80211_set_wakeup -> ath10k device_set_wakeup_enable),
# so no separate udev rule is needed.
# Value 12 = MAGIC (0x8) | DISCONNECT (0x4).
[connection-wifi-wowlan]
match-device=type:wifi
802-11-wireless.wake-on-wlan=12


